# Configuration example only; no serial command is sent.
[driver]
type = "grbl_stepper"
mode = "mock"
enabled = false
arm_id = "arm_02"
transport = "usb_serial"
port = "CHANGE_ME"
baud_rate = 115200
protocol = "grbl"
joint_names = ["joint_1", "joint_2", "joint_3"]
position_unit = "radians"

[safety]
require_homing_before_motion = true
require_feedback = true
max_position_step_rad = 0.05
require_operator_enable = true
require_hardware_estop = true

# A GRBL machine is not automatically a robot-arm controller. Confirm
# firmware, axis mapping, kinematics, soft limits, homing, and command syntax.
