# Configuration example only; no port is opened by ForgeArm.
[driver]
type = "dynamixel"
mode = "mock"
enabled = false
arm_id = "arm_01"
transport = "usb_serial"
port = "CHANGE_ME"
baud_rate = 1000000
protocol_version = "CHANGE_ME"
device_ids = [1, 2, 3]
joint_names = ["joint_1", "joint_2", "joint_3"]
position_unit = "radians"

[safety]
require_feedback = true
max_position_step_rad = 0.05
require_operator_enable = true
require_hardware_estop = true

# Before hardware support: specify exact servo models, firmware, limits,
# direction/offset, homing strategy, watchdog, and manufacturer SDK version.
